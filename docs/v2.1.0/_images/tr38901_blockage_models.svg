<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title description">
  <title id="title">TR 38.901 blockage models A and B</title>
  <desc id="description">
    Model A uses angular blocking regions around a user terminal. Model B uses
    explicitly positioned rectangular screens. Both attenuate line-of-sight
    and individual multipath rays.
  </desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263442"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bd3f4b"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>
  <rect x="24" y="24" width="556" height="405" rx="6"
        fill="#f8fafc" stroke="#c7d0d9" stroke-width="2"/>
  <rect x="620" y="24" width="556" height="405" rx="6"
        fill="#f8fafc" stroke="#c7d0d9" stroke-width="2"/>

  <text x="52" y="62" fill="#263442" font-family="sans-serif"
        font-size="24" font-weight="700">MODEL A</text>
  <text x="52" y="88" fill="#536273" font-family="sans-serif"
        font-size="16">Stochastic angular regions around each UT</text>

  <circle cx="305" cy="255" r="132" fill="none" stroke="#aeb9c4"
          stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M 305 255 L 184 309 A 132 132 0 0 1 173 228 Z"
        fill="#bd3f4b" fill-opacity="0.20" stroke="#bd3f4b"
        stroke-width="2"/>
  <path d="M 305 255 L 357 134 A 132 132 0 0 1 423 198 Z"
        fill="#d39a24" fill-opacity="0.24" stroke="#bd8114"
        stroke-width="2"/>

  <line x1="92" y1="125" x2="296" y2="249" stroke="#177da8"
        stroke-width="3" marker-end="url(#arrow-dark)"/>
  <line x1="492" y1="119" x2="314" y2="247" stroke="#177da8"
        stroke-width="3" marker-end="url(#arrow-dark)"/>
  <line x1="96" y1="357" x2="294" y2="263" stroke="#bd3f4b"
        stroke-width="3" stroke-dasharray="8 6"
        marker-end="url(#arrow-red)"/>

  <g fill="none" stroke="#263442" stroke-width="3">
    <line x1="92" y1="104" x2="92" y2="144"/>
    <line x1="78" y1="144" x2="106" y2="144"/>
    <line x1="82" y1="116" x2="102" y2="116"/>
    <line x1="492" y1="98" x2="492" y2="138"/>
    <line x1="478" y1="138" x2="506" y2="138"/>
    <line x1="482" y1="110" x2="502" y2="110"/>
  </g>
  <rect x="287" y="238" width="36" height="34" rx="5"
        fill="#263442"/>
  <circle cx="305" cy="246" r="5" fill="#ffffff"/>
  <text x="292" y="294" fill="#263442" font-family="sans-serif"
        font-size="16" font-weight="700">UT</text>

  <line x1="160" y1="340" x2="207" y2="307" stroke="#bd3f4b"
        stroke-width="2"/>
  <text x="55" y="367" fill="#9d2f3a" font-family="sans-serif"
        font-size="15" font-weight="600">self-blocking region</text>
  <line x1="445" y1="156" x2="397" y2="170" stroke="#bd8114"
        stroke-width="2"/>
  <text x="245" y="111" fill="#94640f" font-family="sans-serif"
        font-size="15" font-weight="600">sampled non-self blocker</text>
  <text x="167" y="404" fill="#536273" font-family="sans-serif"
        font-size="15">arrival direction selects the loss</text>

  <text x="648" y="62" fill="#263442" font-family="sans-serif"
        font-size="24" font-weight="700">MODEL B</text>
  <text x="648" y="88" fill="#536273" font-family="sans-serif"
        font-size="16">Explicit rectangular screens in the scene</text>

  <line x1="661" y1="353" x2="1138" y2="353" stroke="#98a6b4"
        stroke-width="2"/>
  <g fill="none" stroke="#263442" stroke-width="4">
    <line x1="700" y1="132" x2="700" y2="353"/>
    <line x1="680" y1="353" x2="720" y2="353"/>
    <line x1="682" y1="180" x2="718" y2="180"/>
    <line x1="687" y1="156" x2="713" y2="156"/>
  </g>
  <text x="672" y="120" fill="#263442" font-family="sans-serif"
        font-size="16" font-weight="700">BS</text>

  <polygon points="865,184 906,168 906,353 865,353"
           fill="#bd3f4b" fill-opacity="0.28" stroke="#bd3f4b"
           stroke-width="3"/>
  <circle cx="1090" cy="326" r="15" fill="#263442"/>
  <line x1="1090" y1="341" x2="1090" y2="353" stroke="#263442"
        stroke-width="4"/>
  <text x="1077" y="306" fill="#263442" font-family="sans-serif"
        font-size="16" font-weight="700">UT</text>

  <line x1="700" y1="156" x2="1090" y2="326" stroke="#bd3f4b"
        stroke-width="4" marker-end="url(#arrow-red)"/>
  <polyline points="700,156 822,112 1090,326" fill="none"
            stroke="#177da8" stroke-width="3"
            marker-end="url(#arrow-dark)"/>
  <polyline points="700,156 1000,116 1090,326" fill="none"
            stroke="#2f855a" stroke-width="3"
            marker-end="url(#arrow-dark)"/>

  <line x1="838" y1="184" x2="838" y2="353" stroke="#bd3f4b"
        stroke-width="2" marker-start="url(#arrow-red)"
        marker-end="url(#arrow-red)"/>
  <text x="790" y="273" fill="#9d2f3a" font-family="sans-serif"
        font-size="15" font-weight="600" transform="rotate(-90 790 273)">
    height
  </text>
  <line x1="868" y1="378" x2="905" y2="378" stroke="#bd3f4b"
        stroke-width="2" marker-start="url(#arrow-red)"
        marker-end="url(#arrow-red)"/>
  <text x="866" y="398" fill="#9d2f3a" font-family="sans-serif"
        font-size="15" font-weight="600">width</text>
  <text x="921" y="196" fill="#9d2f3a" font-family="sans-serif"
        font-size="15" font-weight="600">screen center and orientation</text>
  <text x="719" y="422" fill="#536273" font-family="sans-serif"
        font-size="15">path-screen geometry determines the loss</text>

  <rect x="24" y="449" width="1152" height="49" rx="6"
        fill="#eef2f5" stroke="#c7d0d9" stroke-width="2"/>
  <text x="600" y="480" text-anchor="middle" fill="#263442"
        font-family="sans-serif" font-size="18" font-weight="600">
    Output: additional attenuation for LOS and for every generated ray
  </text>
</svg>
