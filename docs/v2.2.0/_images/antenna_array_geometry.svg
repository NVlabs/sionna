<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">Antenna array geometry</title>
  <desc id="desc">Single panel of three rows by four columns of dual-polarized antenna elements in the local y-z plane, with the element spacing parameters annotated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="300" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#333" text-anchor="middle">AntennaArray geometry</text>

  <rect x="126" y="96" width="258" height="188" rx="8" fill="#f7f7f7" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/>

  <g stroke="#c21f30" stroke-width="3" stroke-linecap="round">
    <line x1="142" y1="112" x2="158" y2="128"/><line x1="158" y1="112" x2="142" y2="128"/>
    <line x1="212" y1="112" x2="228" y2="128"/><line x1="228" y1="112" x2="212" y2="128"/>
    <line x1="282" y1="112" x2="298" y2="128"/><line x1="298" y1="112" x2="282" y2="128"/>
    <line x1="352" y1="112" x2="368" y2="128"/><line x1="368" y1="112" x2="352" y2="128"/>

    <line x1="142" y1="182" x2="158" y2="198"/><line x1="158" y1="182" x2="142" y2="198"/>
    <line x1="212" y1="182" x2="228" y2="198"/><line x1="228" y1="182" x2="212" y2="198"/>
    <line x1="282" y1="182" x2="298" y2="198"/><line x1="298" y1="182" x2="282" y2="198"/>
    <line x1="352" y1="182" x2="368" y2="198"/><line x1="368" y1="182" x2="352" y2="198"/>

    <line x1="142" y1="252" x2="158" y2="268"/><line x1="158" y1="252" x2="142" y2="268"/>
    <line x1="212" y1="252" x2="228" y2="268"/><line x1="228" y1="252" x2="212" y2="268"/>
    <line x1="282" y1="252" x2="298" y2="268"/><line x1="298" y1="252" x2="282" y2="268"/>
    <line x1="352" y1="252" x2="368" y2="268"/><line x1="368" y1="252" x2="352" y2="268"/>
  </g>

  <g stroke="#bbb" stroke-width="1">
    <line x1="150" y1="66" x2="150" y2="106"/>
    <line x1="220" y1="66" x2="220" y2="106"/>
    <line x1="96" y1="120" x2="134" y2="120"/>
    <line x1="96" y1="190" x2="134" y2="190"/>
  </g>

  <g stroke="#333" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="150" y1="70" x2="220" y2="70"/>
    <line x1="100" y1="120" x2="100" y2="190"/>
    <line x1="130" y1="302" x2="380" y2="302"/>
    <line x1="400" y1="100" x2="400" y2="280"/>
  </g>

  <g font-family="DejaVu Serif, Times New Roman, serif" font-size="18" font-style="italic" fill="#333">
    <text x="185" y="60" text-anchor="middle">d<tspan font-size="12" font-style="normal" dy="4">H</tspan></text>
    <text x="84" y="155" transform="rotate(-90 84 155)" text-anchor="middle">d<tspan font-size="12" font-style="normal" dy="4">V</tspan></text>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#333">
    <text x="255" y="326" text-anchor="middle">num_cols = 4</text>
    <text x="422" y="190" transform="rotate(-90 422 190)" text-anchor="middle">num_rows = 3</text>
    <text x="255" y="364" text-anchor="middle" font-size="15" fill="#666">single panel centered on the origin</text>
  </g>

  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <line x1="492" y1="392" x2="562" y2="392"/>
    <line x1="492" y1="392" x2="492" y2="322"/>
  </g>
  <circle cx="492" cy="392" r="4" fill="#333"/>
  <g font-family="DejaVu Serif, Times New Roman, serif" font-size="18" fill="#333">
    <text x="570" y="397"><tspan>+</tspan><tspan font-style="italic">y</tspan></text>
    <text x="492" y="312" text-anchor="middle"><tspan>+</tspan><tspan font-style="italic">z</tspan></text>
  </g>
</svg>
