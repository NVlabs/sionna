<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="title desc">
  <title id="title">Handheld UT antenna candidate locations</title>
  <desc id="desc">Flat handheld device in the local x-y plane with eight antenna candidate locations from TR 38.901 Figure 7.3-2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="135" y="75" width="150" height="330" rx="14" fill="#f7f7f7" stroke="#222" stroke-width="3"/>
  <rect x="185" y="92" width="50" height="6" rx="3" fill="#aaa"/>

  <g fill="#fff" stroke="#c21f30" stroke-width="3">
    <circle cx="135" cy="75" r="13"/>
    <circle cx="210" cy="75" r="13"/>
    <circle cx="285" cy="75" r="13"/>
    <circle cx="285" cy="240" r="13"/>
    <circle cx="285" cy="405" r="13"/>
    <circle cx="210" cy="405" r="13"/>
    <circle cx="135" cy="405" r="13"/>
    <circle cx="135" cy="240" r="13"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="middle" dominant-baseline="central">
    <text x="135" y="75">1</text>
    <text x="210" y="75">8</text>
    <text x="285" y="75">7</text>
    <text x="285" y="240">6</text>
    <text x="285" y="405">5</text>
    <text x="210" y="405">4</text>
    <text x="135" y="405">3</text>
    <text x="135" y="240">2</text>
  </g>

  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <line x1="210" y1="240" x2="255" y2="240"/>
    <line x1="210" y1="240" x2="210" y2="292"/>
  </g>
  <circle cx="210" cy="240" r="4" fill="#333"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#333">
    <text x="235" y="231" text-anchor="middle">+y</text>
    <text x="218" y="303">+x</text>
    <text x="210" y="445" text-anchor="middle">width 7 cm</text>
    <text x="315" y="246" transform="rotate(-90 315 246)" text-anchor="middle">depth 15 cm</text>
    <text x="210" y="30" text-anchor="middle" font-size="20" font-weight="700">Handheld UT array LCS</text>
    <text x="210" y="508" text-anchor="middle">Candidate antenna locations 1-8</text>
    <text x="210" y="530" text-anchor="middle">reference +z normal points out of the page</text>
  </g>
</svg>
