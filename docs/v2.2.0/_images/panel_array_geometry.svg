<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="title desc">
  <title id="title">Panel array geometry</title>
  <desc id="desc">Two by two arrangement of antenna panels in the local y-z plane, each panel holding two by two dual-polarized elements, with the element and panel spacing parameters annotated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="280" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#333" text-anchor="middle">PanelArray geometry</text>

  <g fill="#f7f7f7" stroke="#222" stroke-width="2" stroke-dasharray="7 5">
    <rect x="124" y="94" width="112" height="112" rx="8"/>
    <rect x="314" y="94" width="112" height="112" rx="8"/>
    <rect x="124" y="284" width="112" height="112" rx="8"/>
    <rect x="314" y="284" width="112" height="112" rx="8"/>
  </g>

  <g stroke="#c21f30" stroke-width="3" stroke-linecap="round">
    <line x1="142" y1="112" x2="158" y2="128"/><line x1="158" y1="112" x2="142" y2="128"/>
    <line x1="202" y1="112" x2="218" y2="128"/><line x1="218" y1="112" x2="202" y2="128"/>
    <line x1="142" y1="172" x2="158" y2="188"/><line x1="158" y1="172" x2="142" y2="188"/>
    <line x1="202" y1="172" x2="218" y2="188"/><line x1="218" y1="172" x2="202" y2="188"/>

    <line x1="332" y1="112" x2="348" y2="128"/><line x1="348" y1="112" x2="332" y2="128"/>
    <line x1="392" y1="112" x2="408" y2="128"/><line x1="408" y1="112" x2="392" y2="128"/>
    <line x1="332" y1="172" x2="348" y2="188"/><line x1="348" y1="172" x2="332" y2="188"/>
    <line x1="392" y1="172" x2="408" y2="188"/><line x1="408" y1="172" x2="392" y2="188"/>

    <line x1="142" y1="302" x2="158" y2="318"/><line x1="158" y1="302" x2="142" y2="318"/>
    <line x1="202" y1="302" x2="218" y2="318"/><line x1="218" y1="302" x2="202" y2="318"/>
    <line x1="142" y1="362" x2="158" y2="378"/><line x1="158" y1="362" x2="142" y2="378"/>
    <line x1="202" y1="362" x2="218" y2="378"/><line x1="218" y1="362" x2="202" y2="378"/>

    <line x1="332" y1="302" x2="348" y2="318"/><line x1="348" y1="302" x2="332" y2="318"/>
    <line x1="392" y1="302" x2="408" y2="318"/><line x1="408" y1="302" x2="392" y2="318"/>
    <line x1="332" y1="362" x2="348" y2="378"/><line x1="348" y1="362" x2="332" y2="378"/>
    <line x1="392" y1="362" x2="408" y2="378"/><line x1="408" y1="362" x2="392" y2="378"/>
  </g>

  <g stroke="#bbb" stroke-width="1">
    <line x1="150" y1="66" x2="150" y2="104"/>
    <line x1="340" y1="66" x2="340" y2="104"/>
    <line x1="96" y1="120" x2="134" y2="120"/>
    <line x1="96" y1="310" x2="134" y2="310"/>
    <line x1="236" y1="120" x2="262" y2="120"/>
    <line x1="236" y1="180" x2="262" y2="180"/>
  </g>

  <g stroke="#333" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="150" y1="70" x2="340" y2="70"/>
    <line x1="100" y1="120" x2="100" y2="310"/>
    <line x1="150" y1="150" x2="210" y2="150"/>
    <line x1="256" y1="120" x2="256" y2="180"/>
  </g>

  <g font-family="DejaVu Serif, Times New Roman, serif" font-size="18" font-style="italic" fill="#333">
    <text x="245" y="60" text-anchor="middle">D<tspan font-size="12" font-style="normal" dy="4">H</tspan></text>
    <text x="84" y="215" transform="rotate(-90 84 215)" text-anchor="middle">D<tspan font-size="12" font-style="normal" dy="4">V</tspan></text>
    <text x="180" y="143" text-anchor="middle">d<tspan font-size="12" font-style="normal" dy="4">H</tspan></text>
    <text x="268" y="156">d<tspan font-size="12" font-style="normal" dy="4">V</tspan></text>
    <text x="296" y="245">y<tspan font-style="normal"> = </tspan>z<tspan font-style="normal"> = 0</tspan></text>
  </g>
  <text x="180" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#666" text-anchor="middle">one panel</text>

  <g stroke="#333" stroke-width="1.6">
    <line x1="265" y1="230" x2="285" y2="250"/>
    <line x1="285" y1="230" x2="265" y2="250"/>
  </g>

  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <line x1="452" y1="432" x2="522" y2="432"/>
    <line x1="452" y1="432" x2="452" y2="362"/>
  </g>
  <circle cx="452" cy="432" r="4" fill="#333"/>
  <g font-family="DejaVu Serif, Times New Roman, serif" font-size="18" fill="#333">
    <text x="530" y="437"><tspan>+</tspan><tspan font-style="italic">y</tspan></text>
    <text x="452" y="352" text-anchor="middle"><tspan>+</tspan><tspan font-style="italic">z</tspan></text>
  </g>
</svg>
